name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dipendenze Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libgl-dev

      - name: Configura (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configura (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepara il pacchetto (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/Sonora
          cp build/Sonora_artefacts/Release/Sonora dist/Sonora/
          cp build/Sonora_artefacts/Release/sonora-plugin-scanner dist/Sonora/
          tar -czf dist/Sonora-linux-x64.tar.gz -C dist Sonora

      - name: Prepara il pacchetto (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Sonora | Out-Null
          Copy-Item build/Sonora_artefacts/Release/Sonora.exe dist/Sonora/
          Copy-Item build/Sonora_artefacts/Release/sonora-plugin-scanner.exe dist/Sonora/
          Compress-Archive -Path dist/Sonora -DestinationPath dist/Sonora-windows-x64.zip

      - name: Carica il pacchetto
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-${{ runner.os }}
          path: dist/Sonora-*
          retention-days: 30
